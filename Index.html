<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - Politică & Economie</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS pentru citirea fișierelor Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 p-6 min-h-screen font-sans">

    <div class="max-w-[95%] mx-auto bg-white rounded-2xl shadow-xl p-8">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Timeline</h1>
                <p id="status-text" class="text-sm text-slate-500 mt-1">
                    Data de <span id="azi-date-label" class="font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">ASTĂZI (29 Octombrie 2026)</span> este marcată cu verde. <span class="italic text-slate-400 ml-2">(Click pe un eveniment pentru detalii complete)</span>
                </p>
            </div>
            
            <!-- Buton încărcare fișier Excel și afișare denumire fișier -->
            <div class="flex flex-col md:flex-row items-start md:items-center gap-3">
                <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFileUpload(event)">
                <button onclick="document.getElementById('excel-file-input').click()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-2 cursor-pointer">
                    📁 Încarcă fișier Excel actualizat
                </button>
                <span id="file-name-display" class="text-xs text-slate-500 italic bg-slate-50 px-3 py-2 rounded-lg border border-slate-200">Rom-Cipi-Timeline-Pol-Eco.xlsx (Implicit)</span>
            </div>
        </div>

        <!-- Matricea Cronologiei -->
        <div id="timeline-matrix" class="overflow-x-auto relative pb-6 min-h-[350px]">
            <!-- Aici va fi injectată cronologia dinamic -->
        </div>

    </div>

    <!-- Modal pentru detalii eveniment la click -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-lg w-full mx-auto border border-slate-100 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-start mb-4 border-b pb-3">
                <div>
                    <span id="modal-cat" class="text-xs font-black uppercase tracking-wider bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md"></span>
                    <h3 id="modal-title" class="text-lg font-black text-slate-900 mt-2"></h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl px-2">✕</button>
            </div>
            
            <!-- Container dinamic pentru toate capetele de coloană și valorile din Excel -->
            <div id="modal-fields-container" class="space-y-2 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs overflow-y-auto max-h-[60vh]">
            </div>

            <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-xs transition-all mt-auto">Închide</button>
        </div>
    </div>

    <script>
        let currentAzi = "2026-10-29";
        
        let evenimente = [
            { 
                categorie: "USA", 
                eveniment: "Alegeri USA", 
                persoana: "Trump", 
                data: "2026-11-03", 
                importanta: 9,
                detalii_rand: {
                    "Categorie": "USA",
                    "Eveniment": "Alegeri USA",
                    "Persoana": "Trump",
                    "Data": "2026-11-03",
                    "Importanta": 9
                }
            },
            { 
                categorie: "SNN", 
                eveniment: "Cernavoda - Repunere in functiune Unitatile 1 si 2", 
                persoana: "a", 
                data: "2026-11-30", 
                importanta: 7,
                detalii_rand: {
                    "Categorie": "SNN",
                    "Eveniment": "Cernavoda - Repunere in functiune Unitatile 1 si 2",
                    "Persoana": "a",
                    "Data": "2026-11-30",
                    "Mass Media": "ProTV",
                    "Importanta": 7
                }
            }
        ];

        function renderTimeline() {
            const container = document.getElementById("timeline-matrix");
            container.innerHTML = "";

            if (!evenimente.length) {
                container.innerHTML = `<p class="text-center text-slate-400 py-10 text-xs">Nu există evenimente de afișat.</p>`;
                return;
            }

            let aziTime = new Date(currentAzi).setHours(0,0,0,0);

            let sorted = evenimente.map((e, index) => {
                let evTime = new Date(e.data).setHours(0,0,0,0);
                let diffTime = evTime - aziTime;
                let diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                return { ...e, evTime, diffDays, originalIndex: index };
            }).sort((a, b) => a.evTime - b.evTime);

            let dates = sorted.map(e => e.evTime);
            dates.push(aziTime);

            let minTime = Math.min(...dates);
            let maxTime = Math.max(...dates);
            let spanTime = maxTime - minTime || 1;

            let categorii = [...new Set(sorted.map(e => e.categorie))];

            let html = `<div class="relative min-w-[950px] pt-8">`;

            // --- Linii Verticale Anuale (1 Ianuarie) ---
            let startYear = new Date(minTime).getFullYear();
            let endYear = new Date(maxTime).getFullYear();

            for (let yr = startYear; yr <= endYear; yr++) {
                let yTime = new Date(yr, 0, 1).setHours(0,0,0,0);
                if (yTime >= minTime && yTime <= maxTime) {
                    let yearPct = ((yTime - minTime) / spanTime) * 90 + 5;
                    html += `
                        <div class="absolute top-0 bottom-0 z-0 flex flex-col items-center pointer-events-none" style="left: ${yearPct}%;">
                            <span class="text-[9px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-300 mb-1 whitespace-nowrap shadow-xs">${yr}</span>
                            <div class="w-px bg-slate-300 border-r border-dashed border-slate-300 h-full"></div>
                        </div>
                    `;
                }
            }

            // --- Linie Astăzi ---
            let aziPercent = ((aziTime - minTime) / spanTime) * 90 + 5; 
            html += `
                <div class="absolute top-0 bottom-0 z-20 flex flex-col items-center pointer-events-none" style="left: ${aziPercent}%;">
                    <span class="bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow mb-1 whitespace-nowrap z-20">ASTĂZI (${currentAzi})</span>
                    <div class="w-1 bg-emerald-500 h-full rounded shadow-xs"></div>
                </div>
            `;

            html += `<div class="relative border-b-2 border-slate-200 my-6 mx-4"></div>`;

            // --- Randare Categorii și Evenimente cu Algoritm de Decalaj pe Verticală ---
            categorii.forEach(cat => {
                let evCat = sorted.filter(e => e.categorie === cat);

                // Calculare poziții procentuale și grupare/decalaj pentru suprapuneri
                let positionedEvents = [];
                evCat.forEach(ev => {
                    let leftPct = ((ev.evTime - minTime) / spanTime) * 90 + 5;
                    
                    // Verificăm dacă există deja un eveniment poziționat foarte aproape pe axa X (sub 3.5%)
                    let overlappingGroup = positionedEvents.filter(p => Math.abs(p.leftPct - leftPct) < 3.5);
                    let verticalLevel = overlappingGroup.length; // 0 = centru/principal, 1 = sus, 2 = jos, etc.

                    positionedEvents.push({ ...ev, leftPct, verticalLevel });
                });

                // Înălțime dinamică a rândului de categorie în funcție de nivelul maxim de suprapunere
                let maxLevel = Math.max(...positionedEvents.map(p => p.verticalLevel), 0);
                let rowHeightClass = maxLevel > 0 ? "h-28" : "h-16";

                html += `
                    <div class="mb-6 bg-slate-50/80 p-3 rounded-xl border border-slate-200 relative z-10">
                        <h3 class="text-[10px] font-black uppercase tracking-wider text-slate-500 mb-3 bg-slate-200/70 inline-block px-2 py-0.5 rounded">${cat}</h3>
                        <div class="relative ${rowHeightClass} transition-all">
                `;

                positionedEvents.forEach(ev => {
                    let isPast = ev.evTime < aziTime;
                    let isToday = ev.evTime === aziTime;

                    let positionClass = "";
                    let zIndexClass = "z-20 hover:z-40";
                    let containerBorder = "border-slate-200 hover:border-blue-400";
                    let cardBg = "bg-white";

                    if (isToday) {
                        positionClass = "-translate-x-1/2";
                        zIndexClass = "z-30";
                        containerBorder = "border-emerald-500 ring-2 ring-emerald-200";
                    } else if (isPast) {
                        positionClass = "-translate-x-full -mr-3";
                    } else {
                        positionClass = "translate-x-0 ml-3";
                    }

                    // Decalaj pe verticală (top offset) bazat pe level-ul de suprapunere
                    let verticalStyle = "";
                    if (ev.verticalLevel === 0) {
                        verticalStyle = "top-0";
                    } else if (ev.verticalLevel % 2 === 1) {
                        let offset = Math.ceil(ev.verticalLevel / 2) * 26;
                        verticalStyle = `-top-[${offset}px]`;
                    } else {
                        let offset = (ev.verticalLevel / 2) * 26;
                        verticalStyle = `top-[${offset}px]`;
                    }

                    // Fallback stil inline sigur pentru Tailwind JIT
                    let inlineTopStyle = "";
                    if (ev.verticalLevel === 1) inlineTopStyle = "top: -28px;";
                    else if (ev.verticalLevel === 2) inlineTopStyle = "top: 28px;";
                    else if (ev.verticalLevel === 3) inlineTopStyle = "top: -56px;";
                    else if (ev.verticalLevel >= 4) inlineTopStyle = `top: ${(ev.verticalLevel % 2 === 0 ? 1 : -1) * (Math.ceil(ev.verticalLevel / 2) * 28)}px;`;

                    let diffText = "";
                    let diffBadgeClass = "";
                    if (isToday) {
                        diffText = "Astăzi";
                        diffBadgeClass = "bg-emerald-600 text-white font-bold";
                    } else if (isPast) {
                        diffText = `${Math.abs(ev.diffDays)}d în urmă`;
                        diffBadgeClass = "bg-slate-100 text-slate-600 border-slate-200";
                    } else {
                        diffText = `în ${ev.diffDays}d`;
                        diffBadgeClass = "bg-blue-100 text-blue-800 border-blue-300 font-bold";
                    }

                    let pointBg = isToday ? 'bg-emerald-600' : (isPast ? 'bg-slate-400' : 'bg-blue-600');
                    let evJson = encodeURIComponent(JSON.stringify(ev));

                    html += `
                        <div class="absolute transform ${positionClass} ${zIndexClass} cursor-pointer transition-all" style="left: ${ev.leftPct}%; ${inlineTopStyle}" onclick="openModal('${evJson}')">
                            <div class="${cardBg} hover:bg-slate-50 border ${containerBorder} rounded-lg p-1.5 shadow-md transition-all flex flex-col items-center min-w-[125px] max-w-[155px]">
                                <div class="flex items-center gap-1.5 mb-1">
                                    <span class="w-2.5 h-2.5 rounded-full ${pointBg} shrink-0"></span>
                                    <span class="text-[10px] font-bold text-slate-600">${ev.data}</span>
                                </div>
                                <p class="text-[11px] font-bold text-slate-800 text-center leading-tight mb-1 truncate w-full" title="${ev.eveniment}">${ev.eveniment}</p>
                                <span class="text-[9px] px-1.5 py-0.5 rounded border ${diffBadgeClass} whitespace-nowrap">${diffText}</span>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
            document.getElementById("azi-date-label").innerText = `ASTĂZI (${currentAzi})`;
        }

        function openModal(evEncoded) {
            let ev = JSON.parse(decodeURIComponent(evEncoded));
            
            document.getElementById("modal-cat").innerText = ev.categorie || "Eveniment";
            document.getElementById("modal-title").innerText = ev.eveniment || "Detalii";

            let fieldsContainer = document.getElementById("modal-fields-container");
            fieldsContainer.innerHTML = "";

            let diffHtml = "";
            if (ev.diffDays === 0) {
                diffHtml = `<span class="font-bold text-emerald-600">Astăzi</span>`;
            } else if (ev.diffDays < 0) {
                diffHtml = `<span class="font-bold text-slate-600">${Math.abs(ev.diffDays)} zile în urmă</span>`;
            } else {
                diffHtml = `<span class="font-bold text-blue-600">În ${ev.diffDays} zile</span>`;
            }

            fieldsContainer.innerHTML += `
                <div class="flex justify-between items-center border-b pb-1.5 border-slate-200">
                    <strong class="text-slate-500 font-semibold">Diferență față de azi:</strong>
                    <div>${diffHtml}</div>
                </div>
            `;

            if (ev.detalii_rand && Object.keys(ev.detalii_rand).length > 0) {
                Object.entries(ev.detalii_rand).forEach(([capColoana, valoare]) => {
                    if (valoare !== undefined && valoare !== null && String(valoare).trim() !== "" && String(valoare) !== "nan") {
                        let displayVal = valoare;
                        if (typeof valoare === 'string' && valoare.startsWith('http')) {
                            displayVal = `<a href="${valoare}" target="_blank" class="text-blue-600 underline hover:text-blue-800 break-all">${valoare}</a>`;
                        }
                        fieldsContainer.innerHTML += `
                            <div class="flex justify-between items-start border-b pb-1.5 border-slate-200 gap-4">
                                <strong class="text-slate-500 font-semibold shrink-0 max-w-[45%]">${capColoana}:</strong>
                                <span class="font-bold text-slate-800 text-right break-words">${displayVal}</span>
                            </div>
                        `;
                    }
                });
            } else {
                fieldsContainer.innerHTML += `<p class="text-slate-400 italic text-center py-2">Nu există detalii suplimentare pe acest rând.</p>`;
            }

            document.getElementById("event-modal").classList.remove("hidden");
            document.getElementById("event-modal").classList.add("flex");
        }

        function closeModal() {
            document.getElementById("event-modal").classList.remove("flex");
            document.getElementById("event-modal").classList.add("hidden");
        }

        function handleFileUpload(e) {
            let file = e.target.files[0];
            if (!file) return;

            document.getElementById("file-name-display").innerText = file.name;

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, {type: 'array'});
                    let firstSheetName = workbook.SheetNames[0];
                    let worksheet = workbook.Sheets[firstSheetName];
                    
                    let json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                    
                    if (json.length === 0) {
                        alert("Fișierul Excel este gol.");
                        return;
                    }

                    if (json[0] && json[0][0]) {
                        let valA1 = json[0][0];
                        if (typeof valA1 === 'number') {
                            let dateObj = XLSX.SSF.parse_date_code(valA1);
                            if (dateObj) {
                                currentAzi = `${dateObj.y}-${String(dateObj.m).padStart(2, '0')}-${String(dateObj.d).padStart(2, '0')}`;
                            }
                        } else {
                            currentAzi = String(valA1).substring(0, 10);
                        }
                    }

                    let headers = json[0] || [];

                    let newEvenimente = [];
                    for (let i = 2; i < json.length; i++) {
                        let row = json[i];
                        if (!row || row.length === 0) continue;

                        let cat = row[1];
                        let evName = row[2];
                        let dataStr = row[4];

                        if (!evName || !dataStr) continue;

                        if (typeof dataStr === 'number') {
                            let dObj = XLSX.SSF.parse_date_code(dataStr);
                            if (dObj) {
                                dataStr = `${dObj.y}-${String(dObj.m).padStart(2, '0')}-${String(dObj.d).padStart(2, '0')}`;
                            }
                        } else {
                            dataStr = String(dataStr).substring(0, 10);
                        }

                        let detalii_rand = {};
                        headers.forEach((headerName, colIdx) => {
                            if (headerName && row[colIdx] !== undefined) {
                                let val = row[colIdx];
                                if (typeof val === 'number' && String(headerName).toLowerCase().includes('data')) {
                                    let dObj = XLSX.SSF.parse_date_code(val);
                                    if (dObj) {
                                        val = `${dObj.y}-${String(dObj.m).padStart(2, '0')}-${String(dObj.d).padStart(2, '0')}`;
                                    }
                                }
                                detalii_rand[headerName] = val;
                            }
                        });

                        newEvenimente.push({
                            categorie: String(cat || 'General'),
                            eveniment: String(evName),
                            persoana: String(row[3] || '-'),
                            data: String(dataStr),
                            importanta: Number(row[9]) || 5,
                            detalii_rand: detalii_rand
                        });
                    }

                    if (newEvenimente.length > 0) {
                        evenimente = newEvenimente;
                        renderTimeline();
                        alert(`Fișierul Excel a fost încărcat cu succes! S-au preluat ${evenimente.length} evenimente.`);
                    } else {
                        alert("Nu s-au găsit rânduri cu evenimente și date valide în fișierul Excel.");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Eroare la citirea fișierului Excel.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        window.onload = renderTimeline;
    </script>
</body>
</html>
